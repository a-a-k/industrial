name: Audit existing manufacturing decision options
on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [audit, structures]
        default: audit
permissions:
  contents: write
  actions: read
concurrency:
  group: industrial-decision-options
  cancel-in-progress: false
env:
  GH_REPO: ${{ github.repository }}
  PYTHONPATH: .:vendor/simpat
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: python:3.11.16-bookworm@sha256:b99029c95d3d37fb1e4e76d287f7984373dca77c665885986e31b2c95260c13c
      options: --cpus=1 --memory=4g --memory-swap=4g
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python scripts/budget.py
      - run: apt-get update -qq && apt-get install -y --no-install-recommends gh
      - name: Audit frozen pools without production execution
        run: |
          python -m compileall -q industrial/decision_options.py
          python -m industrial.decision_options "$STAGE"
      - if: always()
        run: |
          mkdir -p output/decision-options/provenance
          cp output/budget.json output/decision-options/provenance/ || true
          python scripts/publish.py --name "decision-options-$STAGE" --path output/decision-options
