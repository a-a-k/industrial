name: Diagnose the subprocess RSS measurement window
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: python:3.11.16-bookworm@sha256:b99029c95d3d37fb1e4e76d287f7984373dca77c665885986e31b2c95260c13c
      options: --cpus=1 --memory=4g --memory-swap=4g
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python scripts/budget.py
      - run: apt-get update -qq && apt-get install -y --no-install-recommends gh
      - run: python -m industrial.resource_diagnostics
      - if: always()
        run: |
          mkdir -p output/resource-window/provenance
          cp output/budget.json output/resource-window/provenance/ || true
          python scripts/publish.py --name resource-window --path output/resource-window
