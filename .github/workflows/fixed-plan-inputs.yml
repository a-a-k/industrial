name: Freeze nominal inputs for all ten fixed-plan crash tests
on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [prepare, seal]
        default: prepare
      registry:
        type: string
        default: '{}'
permissions:
  contents: write
  actions: read
concurrency:
  group: industrial-fixed-inputs
  cancel-in-progress: false
env:
  GH_REPO: ${{ github.repository }}
  PYTHONPATH: .:vendor/simpat
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        instance: ${{ fromJSON(inputs.stage == 'seal' && '["seal"]' || '["Mk01","Mk02","Mk03","Mk04","Mk05","Mk06","Mk07","Mk08","Mk09","Mk10"]') }}
    container:
      image: python:3.11.16-bookworm@sha256:b99029c95d3d37fb1e4e76d287f7984373dca77c665885986e31b2c95260c13c
      options: --cpus=1 --memory=4g --memory-swap=4g
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: ${{ inputs.stage }}
      INSTANCE: ${{ matrix.instance }}
      REGISTRY: ${{ inputs.registry }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python scripts/budget.py
      - uses: ./.github/actions/experiment-environment
        with:
          cp: ${{ inputs.stage == 'prepare' && matrix.instance != 'Mk01' && matrix.instance != 'Mk05' && matrix.instance != 'Mk10' && 'true' || 'false' }}
          build: ${{ inputs.stage == 'prepare' && 'public' || 'none' }}
      - name: Reuse frozen plans or invoke the unchanged nominal planner
        run: |
          python -m compileall -q industrial/fixed_plan_inputs.py
          python -m industrial.fixed_plan_inputs "$STAGE" --instance "$INSTANCE" --registry "$REGISTRY"
      - if: always()
        run: |
          mkdir -p output/fixed-input/provenance
          cp output/budget.json output/fixed-input/provenance/ || true
          cp build/*.json output/fixed-input/provenance/ || true
          python scripts/publish.py --name "fixed-input-$INSTANCE" --path output/fixed-input
