name: Complete selectable manufacturing objectives
on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [generate, validate, report]
        required: true
      registry:
        type: string
        default: '{}'
permissions:
  contents: write
  actions: read
concurrency:
  group: industrial-objectives-closure
  cancel-in-progress: false
env:
  GH_REPO: ${{ github.repository }}
  PYTHONPATH: .:vendor/simpat
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  GOMAXPROCS: '1'
jobs:
  objectives:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        instance: ${{ fromJSON(inputs.stage == 'report' && '["report"]' || '["Mk01","Mk05","Mk10"]') }}
    container:
      image: python:3.11.16-bookworm@sha256:b99029c95d3d37fb1e4e76d287f7984373dca77c665885986e31b2c95260c13c
      options: --cpus=1 --memory=4g --memory-swap=4g
    env:
      GH_TOKEN: ${{ github.token }}
      TSFG_SOURCE_SSH_KEY: ${{ secrets.TSFG_SOURCE_SSH_KEY }}
      STAGE: ${{ inputs.stage }}
      INSTANCE: ${{ matrix.instance }}
      REGISTRY: ${{ inputs.registry }}
      FINAL_REPORT: ${{ inputs.stage == 'report' && '1' || '0' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python scripts/budget.py
      - uses: ./.github/actions/experiment-environment
        with:
          cp: ${{ inputs.stage == 'generate' && 'true' || 'false' }}
          build: ${{ inputs.stage == 'generate' && 'public' || inputs.stage == 'validate' && 'tsfg' || 'none' }}
      - name: Compile harness and execute the full registered stage
        run: |
          python -m compileall -q industrial/objectives_closure.py
          if [ "$STAGE" = generate ]; then
            "$CP_PYTHON" -m industrial.objectives_closure generate --instance "$INSTANCE"
          else
            python -m industrial.objectives_closure "$STAGE" --instance "$INSTANCE" --registry "$REGISTRY"
          fi
      - name: Preserve results, schedules and failures
        if: always()
        run: |
          mkdir -p output/objectives/provenance
          cp output/budget.json output/objectives/provenance/ || true
          cp build/*.json output/objectives/provenance/ || true
          python scripts/publish.py --name "objectives-$STAGE-$INSTANCE" --path output/objectives
