name: Interpret the immutable completed risk-cost campaign
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_REPO: ${{ github.repository }}
  PYTHONPATH: .:vendor/simpat
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: python:3.11.16-bookworm@sha256:b99029c95d3d37fb1e4e76d287f7984373dca77c665885986e31b2c95260c13c
      options: --cpus=1 --memory=4g --memory-swap=4g
    env:
      GH_TOKEN: ${{ github.token }}
      FINAL_REPORT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python scripts/budget.py
      - run: apt-get update -qq && apt-get install -y --no-install-recommends gh
      - name: Render the full-cost and risk interpretation from verified primary evidence
        run: python -m industrial.end_to_end_interpretation
      - if: always()
        run: |
          mkdir -p output/end-to-end-interpretation/provenance
          cp output/budget.json output/end-to-end-interpretation/provenance/ || true
          python scripts/publish.py --name end-to-end-interpretation --path output/end-to-end-interpretation
