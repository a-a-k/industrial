name: Inverse requirements for deadline reliability
on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [qualify, catalogue, seal, certify, report]
        default: qualify
      registry:
        type: string
        default: '{}'
permissions:
  contents: write
  actions: read
concurrency:
  group: industrial-inverse-${{ inputs.stage }}
  cancel-in-progress: false
env:
  GH_REPO: ${{ github.repository }}
  PYTHONPATH: .:vendor/simpat
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  inverse:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        cell: ${{ fromJSON(inputs.stage == 'catalogue' && '["Mk01","Mk02","Mk03","Mk04","Mk05","Mk06","Mk07","Mk08","Mk09","Mk10"]' || inputs.stage == 'certify' && '["Mk01-F1","Mk01-F2","Mk02-F1","Mk02-F2","Mk03-F1","Mk03-F2","Mk04-F1","Mk04-F2","Mk05-F1","Mk05-F2","Mk06-F1","Mk06-F2","Mk07-F1","Mk07-F2","Mk08-F1","Mk08-F2","Mk09-F1","Mk09-F2","Mk10-F1","Mk10-F2"]' || '["all"]') }}
    container:
      image: python:3.11.16-bookworm@sha256:b99029c95d3d37fb1e4e76d287f7984373dca77c665885986e31b2c95260c13c
      options: --cpus=1 --memory=4g --memory-swap=4g
    env:
      GH_TOKEN: ${{ github.token }}
      TSFG_SOURCE_SSH_KEY: ${{ secrets.TSFG_SOURCE_SSH_KEY }}
      STAGE: ${{ inputs.stage }}
      CELL: ${{ matrix.cell }}
      REGISTRY: ${{ inputs.registry }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python scripts/budget.py
      - name: Start preparation clock
        run: |
          mkdir -p output/inverse
          date +%s.%N > output/inverse/preparation-start.txt
      - uses: ./.github/actions/experiment-environment
        with:
          cp: ${{ (inputs.stage == 'qualify' || inputs.stage == 'catalogue') && 'true' || 'false' }}
          build: ${{ (inputs.stage == 'qualify' || inputs.stage == 'certify') && 'tsfg' || inputs.stage == 'catalogue' && 'public' || 'none' }}
      - name: Run the frozen inverse stage
        run: |
          python -m compileall -q industrial/inverse_math.py industrial/inverse_conditions.py planning/inverse_candidates.py
          if [ "$STAGE" = qualify ] || [ "$STAGE" = certify ]; then
            python -m industrial.inverse_conditions build
          fi
          date +%s.%N > output/inverse/preparation-end.txt
          INSTANCE="${CELL%-F?}"
          LAW="${CELL##*-}"
          python -m industrial.inverse_conditions "$STAGE" --instance "$INSTANCE" --law "$LAW" --registry "$REGISTRY"
      - if: always()
        run: |
          mkdir -p output/inverse/provenance
          cp output/budget.json output/inverse/provenance/ || true
          cp build/*.json output/inverse/provenance/ || true
          python scripts/publish.py --name "inverse-$STAGE-$CELL" --path output/inverse
