name: Freeze CPython 3.11 environment
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: industrial-campaign
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.16'
          cache: ''
      - name: Resolve and hash wheels
        run: python scripts/bootstrap.py
      - name: Preserve immutable environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create industrial-environment-v1 output/environment.tar.gz output/environment/requirements.lock output/environment/environment.json --target "$GITHUB_SHA" --prerelease --title 'Industrial CPython 3.11 pinned environment' --notes 'Pinned CUDD wheel, complete dependency hashes and reproducibility metadata.'
