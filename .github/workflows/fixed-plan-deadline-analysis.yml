name: Fixed-plan deadline contracts and support invariance
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: fixed-plan-deadline-analysis
  cancel-in-progress: false
jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: python:3.11.16-bookworm@sha256:b99029c95d3d37fb1e4e76d287f7984373dca77c665885986e31b2c95260c13c
      options: --cpus=1 --memory=4g --memory-swap=4g
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Account for all campaign jobs
        run: python scripts/budget.py
      - name: Check frozen input prerequisites and publish mathematical analysis
        run: python scripts/fixed_plan_deadline_analysis.py
      - name: Preserve the complete analysis outcome
        if: always()
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y --no-install-recommends gh
          fi
          mkdir -p output/fixed-plan-deadline-analysis
          cp output/budget*.json output/fixed-plan-deadline-analysis/ || true
          python scripts/publish.py --name fixed-plan-deadline-analysis --path output/fixed-plan-deadline-analysis
