name: Seal or evaluate industrial evidence
on:
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [seal, evaluate]
        required: true
      registry:
        type: string
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: industrial-campaign
  cancel-in-progress: false
env:
  GH_REPO: ${{ github.repository }}
  PYTHONPATH: .:vendor/simpat
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: python:3.11.16-bookworm@sha256:b99029c95d3d37fb1e4e76d287f7984373dca77c665885986e31b2c95260c13c
      options: --cpus=1 --memory=4g --memory-swap=4g
    env:
      GH_TOKEN: ${{ github.token }}
      TASK: ${{ inputs.task }}
      REGISTRY: ${{ inputs.registry }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python scripts/budget.py
      - run: apt-get update -qq && apt-get install -y --no-install-recommends gh
      - name: Install immutable environment
        run: |
          gh release download industrial-environment-v1 --pattern environment.tar.gz --dir output
          tar -xzf output/environment.tar.gz -C output
          cmp requirements.lock output/environment/requirements.lock
          python -m pip install --no-index --find-links output/environment/wheels --require-hashes -r requirements.lock
      - name: Apply fixed evidence registry
        run: |
          python -c 'import os,json;from pathlib import Path;Path("output/registry.json").write_text(json.dumps(json.loads(os.environ["REGISTRY"]),sort_keys=True))'
          python -m industrial.evaluation "$TASK" output/registry.json
      - name: Preserve sealed predictions or independent evaluation
        if: always()
        run: |
          if [ "$TASK" = seal ]; then
            mkdir -p output/seal
            python scripts/publish.py --name seal --path output/seal
          else
            mkdir -p output/evaluation
            python scripts/publish.py --name evaluation --path output/evaluation
          fi
