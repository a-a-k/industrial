name: Paired industrial analysis costs
on:
  workflow_dispatch:
    inputs:
      cases:
        type: string
        required: true
      preparation_qualification:
        type: string
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: industrial-cost-campaign
  cancel-in-progress: false
env:
  GH_REPO: ${{ github.repository }}
  PYTHONPATH: .:vendor/simpat
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: ${{ fromJSON(inputs.cases) }}
    container:
      image: python:3.11.16-bookworm@sha256:b99029c95d3d37fb1e4e76d287f7984373dca77c665885986e31b2c95260c13c
      options: --cpus=1 --memory=4g --memory-swap=4g
    env:
      GH_TOKEN: ${{ github.token }}
      CASE: ${{ matrix.case.id }}
      OBSERVATIONS: ${{ matrix.case.observations }}
      FIT: ${{ matrix.case.fit }}
      PREPARATION_QUALIFICATION: ${{ inputs.preparation_qualification }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python scripts/budget.py
      - run: apt-get update -qq && apt-get install -y --no-install-recommends gh
      - name: Install immutable environment
        run: |
          gh release download industrial-environment-v1 --pattern environment.tar.gz --dir output
          tar -xzf output/environment.tar.gz -C output
          cmp requirements.lock output/environment/requirements.lock
          python -m pip install --no-index --find-links output/environment/wheels --require-hashes -r requirements.lock
      - name: Measure paired methods in fresh processes
        run: python -m industrial.measurement paired --case "$CASE" --observations "$OBSERVATIONS" --fit "$FIT"
      - name: Preserve all measurements and censoring
        if: always()
        run: |
          mkdir -p output/measurement/provenance
          cp output/budget.json output/measurement/provenance/ || true
          python -c 'import os,sys,json;from pathlib import Path;from industrial.common import write_json;write_json("output/measurement/provenance/environment.json",dict(python=sys.version,requirements_sha256=__import__("hashlib").sha256(Path("requirements.lock").read_bytes()).hexdigest(),cpuinfo=Path("/proc/cpuinfo").read_text(),cgroup={p:Path("/sys/fs/cgroup",p).read_text() for p in ("memory.max","cpu.max","cpuset.cpus.effective") if Path("/sys/fs/cgroup",p).exists()}))'
          python scripts/publish.py --name "measurement-$(echo "$CASE" | tr ':' '-')" --path output/measurement
